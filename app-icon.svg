<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Glowing background effect -->
  <circle cx="256" cy="256" r="140" fill="#22c55e" opacity="0.15" filter="url(#glow)" />

  <!-- WhatsApp Speech Bubble Icon -->
  <path d="M256 100 C 170 100 100 170 100 256 C 100 286 109 315 125 339 L 105 410 L 179 391 C 202 404 228 412 256 412 C 342 412 412 342 412 256 C 412 170 342 100 256 100 Z" 
        fill="url(#accent)"/>

  <!-- Inner Gateway Node / Lightning / Device Symbol -->
  <!-- Phone Handset / Connectivity symbol -->
  <path d="M205 185 C 198 185 188 190 182 198 C 175 208 160 230 160 262 C 160 294 184 324 187 328 C 190 332 232 400 300 425 C 345 442 360 425 372 410 C 382 396 392 370 382 355 C 375 344 358 338 340 330 C 322 322 300 312 290 326 C 282 338 274 344 265 338 C 248 326 220 298 208 277 C 202 267 207 259 218 250 C 230 240 220 218 214 200 C 208 184 205 185 205 185 Z" fill="#ffffff" opacity="0.95"/>
  
  <!-- Server Node Indicator Dot -->
  <circle cx="370" cy="142" r="28" fill="#3b82f6" stroke="#0f172a" stroke-width="8"/>
  <circle cx="370" cy="142" r="14" fill="#60a5fa" />
</svg>
